name: 7/24 Otomatik Yayın Zamanlayıcı (06:01-06:07 TR)

on:
  schedule:
    # 06:01 - 06:08 TR penceresi (UTC+3 -> 03:01 - 03:08 UTC)
    - cron: '1,3,5,7,10 3 * * *'
    # Gün içi özel saatler için her 15 dakikada bir kontrol
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: scheduler-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Run Scheduler Tick
        env:
          LIKYA_API_KEY: ${{ secrets.LIKYA_API_KEY }}
        run: |
          RESP=$(curl -fsS --max-time 295 -X POST \
            -H "X-API-Key: $LIKYA_API_KEY" \
            "https://likya-crosspost-api-64i7umkgnq-ew.a.run.app/api/scheduler/tick")
          echo "Scheduler tick response: $RESP"
