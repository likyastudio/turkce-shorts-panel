<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>AKILALMAZ v21 — 2 Aralık 1942 Chicago Pile-1 (3D-Toon Baked + 30fps 2D Çöp Adam)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #141210;
    font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
  }
  #hud { width: 1080px; height: 1920px; display: block; }
  #gl { display: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
</head>
<body>
<canvas id="gl" width="1296" height="2304"></canvas>
<canvas id="hud" width="1080" height="1920"></canvas>
<script>
(() => {
  const W = 1080, H = 1920;
  // Oversized 1.2x Three.js 3D-toon plates for silky-smooth 30fps camera zoom/pan/shake with zero softness!
  const BG_W = 1296, BG_H = 2304;
  const glCanvas = document.getElementById("gl");
  const hudCanvas = document.getElementById("hud");
  const ctx = hudCanvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "low";

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * clamp(t, 0, 1);
  const easeOutBack = (t) => {
    t = clamp(t, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const easeInOut = (t) => {
    t = clamp(t, 0, 1);
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  };
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function shadeHex(hex, amt) {
    let n = parseInt(hex.replace("#", ""), 16);
    let r = clamp((n >> 16) + amt, 0, 255);
    let g = clamp(((n >> 8) & 0xff) + amt, 0, 255);
    let b = clamp((n & 0xff) + amt, 0, 255);
    return `rgb(${r},${g},${b})`;
  }

  // -------------------------------------------------------------------------
  // 1. THREE.JS HIGH-RES 3D-TOON STAGE (Baked ONCE at startup -> 5 renders total!)
  // -------------------------------------------------------------------------
  const renderer = new THREE.WebGLRenderer({
    canvas: glCanvas,
    antialias: true,
    alpha: false,
    preserveDrawingBuffer: true,
  });
  renderer.setSize(BG_W, BG_H, false);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a231b);
  scene.fog = new THREE.Fog(0x2a231b, 18, 42);

  const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 100);
  const hemiLight = new THREE.HemisphereLight(0xfff4dd, 0x5c4630, 0.92);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xfff1d2, 1.05);
  keyLight.position.set(5.5, 11, 8.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 1024;
  keyLight.shadow.mapSize.height = 1024;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 35;
  keyLight.shadow.camera.left = -10;
  keyLight.shadow.camera.right = 10;
  keyLight.shadow.camera.top = 12;
  keyLight.shadow.camera.bottom = -4;
  keyLight.shadow.bias = -0.0012;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xaad4ff, 0.34);
  fillLight.position.set(-7, 5, 5);
  scene.add(fillLight);

  const reactorGlow = new THREE.PointLight(0x52ff7e, 2.0, 12, 1.5);
  reactorGlow.position.set(0, 3.0, 0.6);
  scene.add(reactorGlow);

  function makeWoodTexture(baseA, baseB, lineC, plankCount = 8, vertical = false) {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const gctx = c.getContext("2d");
    const g = gctx.createLinearGradient(0, 0, vertical ? 512 : 0, vertical ? 0 : 512);
    g.addColorStop(0, baseA);
    g.addColorStop(1, baseB);
    gctx.fillStyle = g;
    gctx.fillRect(0, 0, 512, 512);
    const step = 512 / plankCount;
    for (let i = 0; i < plankCount; i++) {
      if (i % 2 === 0) {
        gctx.fillStyle = "rgba(0,0,0,0.065)";
        if (vertical) gctx.fillRect(i * step, 0, step, 512);
        else gctx.fillRect(0, i * step, 512, step);
      }
      gctx.strokeStyle = "rgba(255,235,195,0.06)";
      gctx.lineWidth = 2;
      for (let k = 0; k < 4; k++) {
        gctx.beginPath();
        const off = i * step + (k + 0.5) * (step / 4);
        if (vertical) {
          gctx.moveTo(off, 0); gctx.bezierCurveTo(off + 4, 170, off - 4, 340, off, 512);
        } else {
          gctx.moveTo(0, off); gctx.bezierCurveTo(170, off + 4, 340, off - 4, 512, off);
        }
        gctx.stroke();
      }
      gctx.strokeStyle = lineC;
      gctx.lineWidth = 4;
      gctx.beginPath();
      if (vertical) { gctx.moveTo(i * step, 0); gctx.lineTo(i * step, 512); }
      else { gctx.moveTo(0, i * step); gctx.lineTo(512, i * step); }
      gctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeGraphiteTexture() {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const gctx = c.getContext("2d");
    gctx.fillStyle = "#2b2f38";
    gctx.fillRect(0, 0, 512, 512);
    const rows = 8, cols = 4, bh = 512 / rows, bw = 512 / cols;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * (bw * 0.5);
      for (let col = -1; col <= cols; col++) {
        const x = col * bw + off, y = r * bh;
        const shade = 36 + ((r * 13 + col * 29) & 15);
        gctx.fillStyle = `rgb(${shade},${shade + 4},${shade + 11})`;
        gctx.fillRect(x + 3, y + 3, bw - 6, bh - 6);
        gctx.fillStyle = "rgba(255,255,255,0.08)";
        gctx.fillRect(x + 3, y + 3, bw - 6, 5);
        gctx.strokeStyle = "#14161c";
        gctx.lineWidth = 4;
        gctx.strokeRect(x + 2, y + 2, bw - 4, bh - 4);
      }
    }
    for (let r = 1; r < rows; r += 2) {
      for (let col = 0; col < cols; col++) {
        const cx = col * bw + bw * 0.5, cy = r * bh + bh * 0.5;
        const rg = gctx.createRadialGradient(cx, cy, 2, cx, cy, 19);
        rg.addColorStop(0, "#d8ff72");
        rg.addColorStop(0.45, "#46e86c");
        rg.addColorStop(1, "rgba(40,220,90,0)");
        gctx.fillStyle = rg;
        gctx.beginPath(); gctx.arc(cx, cy, 19, 0, Math.PI * 2); gctx.fill();
        gctx.fillStyle = "#1d2228";
        gctx.beginPath(); gctx.arc(cx, cy, 8, 0, Math.PI * 2); gctx.fill();
        gctx.fillStyle = "#9eff57";
        gctx.beginPath(); gctx.arc(cx, cy, 5, 0, Math.PI * 2); gctx.fill();
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeHazardTexture() {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 128;
    const gctx = c.getContext("2d");
    gctx.fillStyle = "#f4c425"; gctx.fillRect(0, 0, 512, 128);
    gctx.fillStyle = "#1c1c22";
    for (let x = -128; x < 640; x += 64) {
      gctx.beginPath();
      gctx.moveTo(x, 0); gctx.lineTo(x + 32, 0);
      gctx.lineTo(x - 16, 128); gctx.lineTo(x - 48, 128);
      gctx.closePath(); gctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makePlaqueTexture(topText, subText) {
    const c = document.createElement("canvas");
    c.width = 768; c.height = 256;
    const gctx = c.getContext("2d");
    gctx.fillStyle = "#181822"; roundRect(gctx, 4, 4, 760, 248, 28); gctx.fill();
    gctx.fillStyle = "#f4c425"; roundRect(gctx, 14, 14, 740, 228, 22); gctx.fill();
    gctx.fillStyle = "#1c4d96"; roundRect(gctx, 26, 26, 716, 204, 16); gctx.fill();
    gctx.textAlign = "center"; gctx.textBaseline = "middle";
    gctx.fillStyle = "#ffd95a"; gctx.font = "bold 62px 'DejaVu Sans', sans-serif";
    gctx.fillText(topText, 384, 100);
    gctx.fillStyle = "#ffffff"; gctx.font = "bold 36px 'DejaVu Sans', sans-serif";
    gctx.fillText(subText, 384, 175);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeBoardTexture(title, lines, bgHex, accentHex, badgeText) {
    const c = document.createElement("canvas");
    c.width = 1024; c.height = 768;
    const gctx = c.getContext("2d");
    gctx.fillStyle = "#171720"; roundRect(gctx, 6, 6, 1012, 756, 36); gctx.fill();
    gctx.fillStyle = accentHex; roundRect(gctx, 20, 20, 984, 728, 28); gctx.fill();
    const grad = gctx.createLinearGradient(0, 36, 0, 732);
    grad.addColorStop(0, bgHex); grad.addColorStop(1, shadeHex(bgHex, -22));
    gctx.fillStyle = grad; roundRect(gctx, 38, 38, 948, 692, 20); gctx.fill();
    gctx.fillStyle = "rgba(255,255,255,0.06)"; roundRect(gctx, 46, 46, 932, 160, 14); gctx.fill();

    const fitFont = (txt, maxW, maxSz, minSz = 22) => {
      for (let sz = maxSz; sz >= minSz; sz -= 2) {
        gctx.font = `bold ${sz}px 'DejaVu Sans', sans-serif`;
        if (gctx.measureText(txt).width <= maxW) return sz;
      }
      return minSz;
    };
    gctx.textAlign = "center"; gctx.textBaseline = "middle";
    gctx.lineWidth = 10; gctx.strokeStyle = "rgba(15,15,24,0.65)";
    fitFont(title, 860, 54, 34);
    gctx.strokeText(title, 512, 132);
    gctx.fillStyle = "#ffe066"; gctx.fillText(title, 512, 132);
    gctx.strokeStyle = "rgba(255,224,102,0.55)"; gctx.lineWidth = 4;
    gctx.beginPath(); gctx.moveTo(96, 198); gctx.lineTo(928, 198); gctx.stroke();

    lines.forEach((line, idx) => {
      const y = 296 + idx * 116;
      fitFont(line, 845, 42, 26);
      gctx.lineWidth = 8; gctx.strokeStyle = "rgba(12,12,18,0.65)";
      gctx.strokeText(line, 512, y);
      gctx.fillStyle = idx === 2 ? "#ffe87a" : "#ffffff";
      gctx.fillText(line, 512, y);
    });

    if (badgeText) {
      gctx.fillStyle = "#171720"; roundRect(gctx, 180, 620, 664, 78, 39); gctx.fill();
      gctx.fillStyle = "#ffd644"; roundRect(gctx, 188, 628, 648, 62, 31); gctx.fill();
      gctx.fillStyle = "#171720";
      fitFont(badgeText, 590, 34, 22);
      gctx.fillText(badgeText, 512, 660);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // Room geometry
  const floorTex = makeWoodTexture("#b78144", "#8e5d28", "#4f3112", 10, true);
  floorTex.repeat.set(3, 3);
  const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.78 }));
  floorMesh.rotation.x = -Math.PI / 2; floorMesh.receiveShadow = true;
  scene.add(floorMesh);

  const wallTex = makeWoodTexture("#d5a662", "#a57335", "#69451c", 10, false);
  wallTex.repeat.set(2, 2);
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.85 }));
  backWall.position.set(0, 9.5, -5.2); backWall.receiveShadow = true;
  scene.add(backWall);

  const baseboard = new THREE.Mesh(new THREE.BoxGeometry(30, 1.35, 0.25), new THREE.MeshStandardMaterial({ color: 0x5c3c1e, roughness: 0.8 }));
  baseboard.position.set(0, 0.67, -5.05); baseboard.receiveShadow = true;
  scene.add(baseboard);

  // Reactor Group
  const groupReactor = new THREE.Group();
  scene.add(groupReactor);
  const rafterMat = new THREE.MeshStandardMaterial({ color: 0x4b3119, roughness: 0.85 });
  for (let i = -3; i <= 3; i++) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(16, 0.35, 0.35), rafterMat);
    beam.position.set(0, 8.2 + Math.abs(i) * 0.22, -4.5 + i * 1.4);
    beam.rotation.z = i * 0.025;
    groupReactor.add(beam);
  }
  const graphiteMat = new THREE.MeshStandardMaterial({
    map: makeGraphiteTexture(), roughness: 0.65, metalness: 0.15,
    emissive: new THREE.Color(0x143c1e), emissiveIntensity: 0.5,
  });
  const reactorBase = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.48, 3.6), new THREE.MeshStandardMaterial({ map: makeHazardTexture(), roughness: 0.5 }));
  reactorBase.position.set(0, 0.24, -1.8); reactorBase.castShadow = true; reactorBase.receiveShadow = true;
  groupReactor.add(reactorBase);

  const reactorTier1 = new THREE.Mesh(new THREE.BoxGeometry(3.8, 2.3, 3.1), graphiteMat);
  reactorTier1.position.set(0, 1.62, -1.8); reactorTier1.castShadow = true; reactorTier1.receiveShadow = true;
  groupReactor.add(reactorTier1);

  const reactorTier2 = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.5, 2.5), graphiteMat);
  reactorTier2.position.set(0, 3.5, -1.8); reactorTier2.castShadow = true; reactorTier2.receiveShadow = true;
  groupReactor.add(reactorTier2);

  const woodPostMat = new THREE.MeshStandardMaterial({ color: 0x7a4e24, roughness: 0.82 });
  [[-2.05, -0.25], [2.05, -0.25], [-2.05, -3.35], [2.05, -3.35]].forEach(([px, pz]) => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 4.7, 0.22), woodPostMat);
    post.position.set(px, 2.35, pz); post.castShadow = true;
    groupReactor.add(post);
  });

  const balconyDeck = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.28, 1.8), woodPostMat);
  balconyDeck.position.set(0, 5.25, -2.0); balconyDeck.castShadow = true;
  groupReactor.add(balconyDeck);
  const railBar = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.12, 0.12), rafterMat);
  railBar.position.set(0, 6.02, -1.15); groupReactor.add(railBar);
  for (let rx = -3.3; rx <= 3.3; rx += 1.1) {
    const bal = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.78, 0.1), rafterMat);
    bal.position.set(rx, 5.64, -1.15); groupReactor.add(bal);
  }

  const ropeMat = new THREE.MeshStandardMaterial({ color: 0xe6c373, roughness: 0.9 });
  const rodMat = new THREE.MeshStandardMaterial({ color: 0xd92626, roughness: 0.35, metalness: 0.45, emissive: 0x550808 });

  const scramAssembly = new THREE.Group();
  scramAssembly.position.set(0.68, 5.25, -0.55);
  groupReactor.add(scramAssembly);
  const ropeMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.75, 12), ropeMat);
  ropeMesh.position.set(0, -0.82, 0); scramAssembly.add(ropeMesh);
  const controlRod = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.25, 16), rodMat);
  controlRod.position.set(0, -1.95, 0); controlRod.castShadow = true; scramAssembly.add(controlRod);
  const rodTip = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.35, 16), new THREE.MeshStandardMaterial({ color: 0xffd23f, metalness: 0.5, roughness: 0.3 }));
  rodTip.rotation.x = Math.PI; rodTip.position.set(0, -2.72, 0); scramAssembly.add(rodTip);

  const signPost = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.7, 10), rafterMat);
  signPost.position.set(-1.15, 2.35, -0.3); signPost.castShadow = true; groupReactor.add(signPost);
  const plaqueMesh = new THREE.Mesh(
    new THREE.BoxGeometry(2.38, 0.84, 0.14),
    [rafterMat, rafterMat, rafterMat, rafterMat, new THREE.MeshStandardMaterial({ map: makePlaqueTexture("CHICAGO · 1942", "STAGG FIELD STADYUMU"), roughness: 0.5 }), rafterMat]
  );
  plaqueMesh.position.set(-0.92, 4.48, -0.22); plaqueMesh.rotation.y = 0.08; plaqueMesh.castShadow = true;
  groupReactor.add(plaqueMesh);

  // Boards Group
  const groupBoards = new THREE.Group();
  scene.add(groupBoards);
  const boardTex2 = makeBoardTexture("2 ARALIK 1942 · CHICAGO", ["SOĞUTMA SİSTEMİ: YOK!", "RADYASYON KALKANI: YOK!", "400 TON GRAFİT TUĞLA YIĞINI"], "#184c96", "#f5c531", "STADYUM ALTINDA GİZLİ DENEY!");
  const boardTex3 = makeBoardTexture("ACİL DURUM PLANI: BALTA!", ["HALATA BAĞLI FREN ÇUBUĞU", "BALKONDA ELİNDE BALTA BEKLEYEN ADAM", "TERS GİDERSE İPİ KES!"], "#a81e22", "#f5c531", "S.C.R.A.M. = BALTALI ADAM");
  const boardTex4 = makeBoardTexture("B PLANI: \"İNTİHAR TİMİ\"", ["TEPEDE BEKLEYEN 3 BİLİM İNSANI", "ELLERİNDE KADMİYUM KOVALARI", "REAKTÖR TAŞARSA ÜZERİNE DÖK!"], "#c2590c", "#ffe066", "KOVAYLA NÜKLEER SÖNDÜRME!");
  const boardTex5 = makeBoardTexture("15:25 · NÜKLEER ÇAĞ BAŞLADI!", ["28 DAKİKA SORUNSUZ ÇALIŞTI", "BALTAYA HİÇ GEREK KALMADI!", "SCRAM ADI HÂLÂ BALTALI ADAM'DAN"], "#156e43", "#ffd84d", "KÂĞIT BARDAKLARLA KUTLAMA!");

  const boardFrameMat = new THREE.MeshStandardMaterial({ color: 0x3b2614, roughness: 0.7 });
  const boardFaceMat = new THREE.MeshStandardMaterial({ map: boardTex2, roughness: 0.45 });
  const boardMesh = new THREE.Mesh(
    new THREE.BoxGeometry(4.55, 3.45, 0.24),
    [boardFrameMat, boardFrameMat, boardFrameMat, boardFrameMat, boardFaceMat, boardFrameMat]
  );
  boardMesh.position.set(0, 5.15, -3.2); boardMesh.castShadow = true;
  groupBoards.add(boardMesh);

  const scene3RopeGroup = new THREE.Group();
  scene3RopeGroup.position.set(0.05, 3.55, 0.35);
  groupBoards.add(scene3RopeGroup);
  const s3Pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.14, 16), new THREE.MeshStandardMaterial({ color: 0xffd23f, metalness: 0.5, roughness: 0.35 }));
  s3Pulley.rotation.x = Math.PI / 2; scene3RopeGroup.add(s3Pulley);
  const s3Rope = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 1.9, 12), ropeMat);
  s3Rope.position.y = -0.95; scene3RopeGroup.add(s3Rope);
  const s3Weight = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.78, 16), rodMat);
  s3Weight.position.y = -2.15; scene3RopeGroup.add(s3Weight);

  // Bake 5 crystal-clear 1296x2304 3D-toon backdrop canvases ONCE!
  function bakePlate(setupFn) {
    groupReactor.visible = false;
    groupBoards.visible = false;
    scene3RopeGroup.visible = false;
    keyLight.color.setHex(0xfff1d2);
    reactorGlow.color.setHex(0x52ff7e);
    setupFn();
    renderer.render(scene, camera);
    const copy = document.createElement("canvas");
    copy.width = BG_W; copy.height = BG_H;
    copy.getContext("2d").drawImage(glCanvas, 0, 0);
    return copy;
  }

  const PLATES = {
    reactor: bakePlate(() => {
      groupReactor.visible = true;
      camera.position.set(0, 3.4, 11.7);
      camera.lookAt(0, 3.25, -0.8);
    }),
    board2: bakePlate(() => {
      groupBoards.visible = true;
      boardFaceMat.map = boardTex2; boardFaceMat.needsUpdate = true;
      camera.position.set(0, 3.35, 11.6);
      camera.lookAt(0, 3.55, -2.5);
    }),
    board3: bakePlate(() => {
      groupBoards.visible = true;
      scene3RopeGroup.visible = true;
      boardFaceMat.map = boardTex3; boardFaceMat.needsUpdate = true;
      keyLight.color.setHex(0xffd2b8);
      reactorGlow.color.setHex(0xff3838);
      camera.position.set(0, 3.35, 11.5);
      camera.lookAt(0, 3.55, -2.4);
    }),
    board4: bakePlate(() => {
      groupBoards.visible = true;
      boardFaceMat.map = boardTex4; boardFaceMat.needsUpdate = true;
      keyLight.color.setHex(0xffe0a8);
      reactorGlow.color.setHex(0xff9f2e);
      camera.position.set(0, 3.35, 11.8);
      camera.lookAt(0, 3.55, -2.4);
    }),
    board5: bakePlate(() => {
      groupBoards.visible = true;
      boardFaceMat.map = boardTex5; boardFaceMat.needsUpdate = true;
      keyLight.color.setHex(0xfff7dc);
      reactorGlow.color.setHex(0x4dff88);
      camera.position.set(0, 3.35, 11.5);
      camera.lookAt(0, 3.55, -2.4);
    }),
  };

  // Free WebGL context after baking so Chromium memory stays ultra-light!
  renderer.dispose();

  // -------------------------------------------------------------------------
  // 2. BLAZING-FAST 30FPS 2D STICK-FIGURE ("ÇÖP ADAM") CHARACTER DRAWER
  // -------------------------------------------------------------------------
  function drawStickChar(c, role, x, footY, scale, t, opts = {}) {
    const {
      emotion = "happy",
      pose = "idle",
      speaking = false,
      facing = 1,
      phase = 0,
      prop = "none",
    } = opts;

    const INK = "#181722";
    const bob = Math.sin(t * 5.2 + phase) * 8;
    const sway = Math.sin(t * 2.6 + phase) * 5;

    c.save();
    c.translate(x, footY);
    c.scale(scale, scale);

    // Soft elliptical 3D floor contact shadow right under shoes!
    const sg = c.createRadialGradient(0, 4, 12, 0, 4, 125);
    sg.addColorStop(0, "rgba(20,12,4,0.48)");
    sg.addColorStop(1, "rgba(20,12,4,0)");
    c.fillStyle = sg;
    c.beginPath(); c.ellipse(0, 4, 125, 32, 0, 0, Math.PI * 2); c.fill();

    // Local coordinates: foot at y = 0, hip at -170, torsoTop at -355, head at -472
    const cx = sway;
    const hipY = -170 + bob * 0.4;
    const torsoTopY = -355 + bob;
    const headY = -472 + bob;
    const headR = 112;

    c.lineCap = "round";
    c.lineJoin = "round";

    // Stick legs + shoes
    c.strokeStyle = INK;
    c.lineWidth = 18;
    const step = pose === "panic" ? Math.sin(t * 18 + phase) * 14 : 0;
    c.beginPath();
    c.moveTo(cx - 38, hipY); c.lineTo(cx - 46, step);
    c.moveTo(cx + 38, hipY); c.lineTo(cx + 46, -step);
    c.stroke();

    c.fillStyle = INK;
    c.beginPath();
    c.ellipse(cx - 52, step, 22, 11, 0, 0, Math.PI * 2);
    c.ellipse(cx + 52, -step, 22, 11, 0, 0, Math.PI * 2);
    c.fill();

    const drawArm = (sx, sy, ex, ey, mx, my) => {
      c.strokeStyle = INK;
      c.lineWidth = 17;
      c.beginPath();
      c.moveTo(sx, sy);
      c.quadraticCurveTo(mx, my, ex, ey);
      c.stroke();
      c.fillStyle = "#f7cba0";
      c.beginPath(); c.arc(ex, ey, 16, 0, Math.PI * 2); c.fill();
      c.lineWidth = 7; c.stroke();
    };

    let lHand = [cx - 125, torsoTopY + 125];
    let rHand = [cx + 125, torsoTopY + 125];
    let lCtrl = [cx - 115, torsoTopY + 60];
    let rCtrl = [cx + 115, torsoTopY + 60];

    if (pose === "wave" || pose === "cheer") {
      const wv = Math.sin(t * 11 + phase) * 28;
      lHand = [cx - 145, torsoTopY - 65 + wv];
      rHand = [cx + 145, torsoTopY - 65 - wv];
      lCtrl = [cx - 145, torsoTopY + 20];
      rCtrl = [cx + 145, torsoTopY + 20];
    } else if (pose === "point_up") {
      const pt = Math.sin(t * 7 + phase) * 12;
      lHand = [cx - 110, torsoTopY + 130];
      rHand = [cx + 140 * facing, torsoTopY - 85 + pt];
      rCtrl = [cx + 120 * facing, torsoTopY + 10];
    } else if (pose === "axe_ready" || pose === "axe_swing") {
      const sw = pose === "axe_swing" ? Math.sin(t * 11.5) * 48 : Math.sin(t * 4.5) * 14;
      lHand = [cx - 122, torsoTopY - 38 + sw];
      lCtrl = [cx - 125, torsoTopY + 35];
      rHand = [cx + 110, torsoTopY + 118];
    } else if (pose === "panic") {
      const sh = Math.sin(t * 22 + phase) * 16;
      lHand = [cx - 145, torsoTopY - 45 + sh];
      rHand = [cx + 145, torsoTopY - 45 - sh];
    } else if (pose === "bucket") {
      const sl = Math.sin(t * 12 + phase) * 12;
      lHand = [cx - 88, torsoTopY + 42 + sl];
      rHand = [cx + 88, torsoTopY + 42 - sl];
    } else if (pose === "toast") {
      const cl = Math.sin(t * 8 + phase) * 14;
      lHand = [cx - 115, torsoTopY + 110];
      rHand = [cx + 128 * facing, torsoTopY - 22 + cl];
      rCtrl = [cx + 125 * facing, torsoTopY + 48];
    } else {
      const g = speaking ? Math.sin(t * 10 + phase) * 24 : Math.sin(t * 3 + phase) * 8;
      lHand = [cx - 118, torsoTopY + 108 + g * 0.5];
      rHand = [cx + 126, torsoTopY + 60 - g];
    }

    drawArm(cx - 64, torsoTopY + 34, lHand[0], lHand[1], lCtrl[0], lCtrl[1]);
    drawArm(cx + 64, torsoTopY + 34, rHand[0], rHand[1], rCtrl[0], rCtrl[1]);

    // Torso
    let bodyFill = "#f2f4f8", innerFill = "#2a528a", tieColor = "#d93434";
    if (role === "axeman") { bodyFill = "#203a68"; innerFill = "#1a2f55"; tieColor = "#f4c425"; }
    else if (role === "scientist2") { bodyFill = "#eef2f7"; innerFill = "#2d7050"; tieColor = "#e88b25"; }
    else if (role === "scientist3") { bodyFill = "#eef2f7"; innerFill = "#683b7a"; tieColor = "#38a3d1"; }

    c.fillStyle = bodyFill; c.strokeStyle = INK; c.lineWidth = 14;
    roundRect(c, cx - 72, torsoTopY, 144, 198, 56);
    c.fill(); c.stroke();

    if (role === "axeman") {
      c.fillStyle = "#f4c425";
      c.beginPath();
      c.moveTo(cx - 56, torsoTopY + 10); c.lineTo(cx - 24, torsoTopY + 6);
      c.lineTo(cx + 62, torsoTopY + 178); c.lineTo(cx + 30, torsoTopY + 188);
      c.closePath(); c.fill(); c.lineWidth = 7; c.stroke();
      c.fillStyle = "#181722"; c.fillRect(cx - 68, torsoTopY + 140, 136, 22);
      c.fillStyle = "#ffd95a"; c.fillRect(cx - 18, torsoTopY + 138, 36, 26);
    } else {
      c.fillStyle = innerFill;
      c.beginPath(); c.moveTo(cx - 32, torsoTopY + 4); c.lineTo(cx + 32, torsoTopY + 4); c.lineTo(cx, torsoTopY + 92); c.closePath(); c.fill();
      c.fillStyle = tieColor;
      c.beginPath();
      c.moveTo(cx - 9, torsoTopY + 8); c.lineTo(cx + 9, torsoTopY + 8);
      c.lineTo(cx + 12, torsoTopY + 76); c.lineTo(cx, torsoTopY + 94); c.lineTo(cx - 12, torsoTopY + 76);
      c.closePath(); c.fill();
      c.strokeStyle = INK; c.lineWidth = 6;
      c.beginPath(); c.moveTo(cx, torsoTopY + 92); c.lineTo(cx, torsoTopY + 195); c.stroke();
      c.strokeRect(cx + 18, torsoTopY + 98, 32, 26);
    }

    // Round peach head
    c.fillStyle = "#f7cba0"; c.strokeStyle = INK; c.lineWidth = 14;
    c.beginPath(); c.arc(cx, headY, headR, 0, Math.PI * 2); c.fill(); c.stroke();

    c.fillStyle = "rgba(240, 120, 105, 0.28)";
    c.beginPath();
    c.ellipse(cx - 56, headY + 26, 20, 12, 0, 0, Math.PI * 2);
    c.ellipse(cx + 56, headY + 26, 20, 12, 0, 0, Math.PI * 2);
    c.fill();

    // Hair / Hat
    if (role === "fermi") {
      c.fillStyle = "#2b221e";
      c.beginPath();
      c.arc(cx, headY - 12, headR + 2, Math.PI * 1.08, Math.PI * 1.92);
      c.quadraticCurveTo(cx + 40, headY - 52, cx - 22, headY - 62);
      c.quadraticCurveTo(cx - 72, headY - 45, cx - headR, headY - 28);
      c.closePath(); c.fill(); c.lineWidth = 10; c.stroke();
    } else if (role === "axeman") {
      c.fillStyle = "#1c3663"; c.strokeStyle = INK; c.lineWidth = 11;
      c.beginPath();
      c.ellipse(cx, headY - 94, 106, 48, 0, Math.PI, Math.PI * 2);
      c.lineTo(cx + 106, headY - 78); c.lineTo(cx - 106, headY - 78);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = "#141824"; roundRect(c, cx - 104, headY - 84, 208, 22, 10); c.fill(); c.stroke();
      c.fillStyle = "#ffd644"; c.beginPath(); c.arc(cx, headY - 106, 17, 0, Math.PI * 2); c.fill(); c.lineWidth = 6; c.stroke();
    } else if (role === "scientist2") {
      c.fillStyle = "#d8dce6"; c.strokeStyle = INK; c.lineWidth = 10;
      [[-88, -56, 36], [88, -56, 36], [-52, -96, 34], [52, -96, 34], [0, -108, 36]].forEach(([ox, oy, r]) => {
        c.beginPath(); c.arc(cx + ox, headY + oy, r, 0, Math.PI * 2); c.fill(); c.stroke();
      });
    } else {
      c.fillStyle = "#5c3b24"; c.strokeStyle = INK; c.lineWidth = 10;
      [[-68, -82, 30], [-25, -102, 32], [25, -102, 32], [68, -82, 30]].forEach(([ox, oy, r]) => {
        c.beginPath(); c.arc(cx + ox, headY + oy, r, 0, Math.PI * 2); c.fill(); c.stroke();
      });
    }

    // Eyes & Brows
    const blink = ((t + phase) % 3.4) > 3.25;
    const exL = cx - 36, exR = cx + 36, ey = headY - 4;
    c.strokeStyle = INK; c.lineWidth = 9;
    if (emotion === "happy" || emotion === "smug") {
      c.beginPath(); c.arc(exL, ey + 6, 20, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
      c.beginPath(); c.arc(exR, ey + 6, 20, Math.PI * 1.12, Math.PI * 1.88); c.stroke();
    } else if (blink) {
      c.beginPath();
      c.moveTo(exL - 20, ey); c.lineTo(exL + 20, ey);
      c.moveTo(exR - 20, ey); c.lineTo(exR + 20, ey);
      c.stroke();
    } else if (emotion === "shock" || emotion === "panic") {
      [exL, exR].forEach((ex) => {
        c.fillStyle = "#ffffff"; c.beginPath(); c.arc(ex, ey, 26, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = INK;
        const jx = emotion === "panic" ? Math.sin(t * 25 + phase) * 3 : 0;
        c.beginPath(); c.arc(ex + jx + facing * 4, ey, 8, 0, Math.PI * 2); c.fill();
      });
      c.lineWidth = 8;
      c.beginPath();
      c.moveTo(exL - 24, ey - 36); c.lineTo(exL + 16, ey - 46);
      c.moveTo(exR - 16, ey - 46); c.lineTo(exR + 24, ey - 36);
      c.stroke();
    } else {
      [exL, exR].forEach((ex) => {
        c.fillStyle = "#ffffff"; c.beginPath(); c.arc(ex, ey, 21, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = INK; c.beginPath(); c.arc(ex + facing * 5, ey, 9, 0, Math.PI * 2); c.fill();
      });
      c.lineWidth = 8;
      c.beginPath();
      c.moveTo(exL - 20, ey - 32); c.lineTo(exL + 18, ey - 34);
      c.moveTo(exR - 18, ey - 34); c.lineTo(exR + 20, ey - 32);
      c.stroke();
    }

    if (role === "fermi") {
      c.strokeStyle = INK; c.lineWidth = 7;
      c.beginPath(); c.arc(exL, ey, 29, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.arc(exR, ey, 29, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.moveTo(exL + 29, ey); c.lineTo(exR - 29, ey); c.stroke();
    }

    // Animated Mouth
    const my = headY + 52;
    c.strokeStyle = INK; c.lineWidth = 8;
    if (speaking) {
      const openH = 12 + Math.abs(Math.sin(t * 21 + phase)) * 22;
      c.fillStyle = "#6e1a24";
      c.beginPath(); c.ellipse(cx, my, 25, openH, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = "#e85c6b";
      c.beginPath(); c.ellipse(cx, my + openH * 0.45, 14, openH * 0.35, 0, 0, Math.PI * 2); c.fill();
    } else if (emotion === "shock" || emotion === "panic") {
      c.fillStyle = "#6e1a24";
      c.beginPath(); c.ellipse(cx, my + 4, 20, 26, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    } else if (emotion === "happy" || emotion === "smug") {
      c.beginPath(); c.arc(cx, my - 10, 28, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
    } else {
      c.beginPath(); c.moveTo(cx - 22, my + 2); c.quadraticCurveTo(cx, my - 6, cx + 22, my + 2); c.stroke();
    }

    // Sweat drops
    if (emotion === "panic" || emotion === "shock" || emotion === "nervous") {
      const dropOff = ((t * 95 + phase * 30) % 42);
      c.fillStyle = "#4cd3ff"; c.strokeStyle = INK; c.lineWidth = 6;
      const dx = cx + 82, dy = headY - 46 + dropOff;
      c.beginPath();
      c.moveTo(dx, dy - 18); c.quadraticCurveTo(dx + 15, dy + 4, dx, dy + 16);
      c.quadraticCurveTo(dx - 15, dy + 4, dx, dy - 18); c.closePath();
      c.fill(); c.stroke();
    }

    // Props
    if (prop === "axe") {
      const hx = lHand[0], hy = lHand[1];
      const ang = pose === "axe_swing" ? (-0.25 - Math.sin(t * 11.5) * 0.55) : -0.45;
      c.save();
      c.translate(hx, hy); c.rotate(ang);
      c.fillStyle = "#a6642c"; c.strokeStyle = INK; c.lineWidth = 9;
      roundRect(c, -11, -185, 22, 235, 10); c.fill(); c.stroke();
      c.fillStyle = "#d5dfe9";
      c.beginPath();
      c.moveTo(12, -172); c.lineTo(-72, -206);
      c.quadraticCurveTo(-92, -152, -70, -100); c.lineTo(12, -124);
      c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = "#ffffff"; c.lineWidth = 7;
      c.beginPath(); c.moveTo(-64, -193); c.quadraticCurveTo(-81, -152, -63, -112); c.stroke();
      c.restore();
    } else if (prop === "bucket") {
      const bx = cx, by = torsoTopY + 46 + Math.sin(t * 12 + phase) * 8;
      c.save();
      c.translate(bx, by); c.rotate(Math.sin(t * 9 + phase) * 0.14);
      c.fillStyle = "#38d4ff"; c.strokeStyle = INK; c.lineWidth = 6;
      [-32, 0, 34].forEach((ox, i) => {
        const sy = -68 - Math.abs(Math.sin(t * 14 + i + phase)) * 22;
        c.beginPath(); c.arc(ox, sy, 10, 0, Math.PI * 2); c.fill(); c.stroke();
      });
      c.fillStyle = "#1f88e5"; c.strokeStyle = INK; c.lineWidth = 10;
      c.beginPath();
      c.moveTo(-64, -42); c.lineTo(64, -42); c.lineTo(48, 56); c.lineTo(-48, 56);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = "#6cc8ff"; c.beginPath(); c.ellipse(0, -42, 64, 15, 0, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = "#ffffff"; c.font = "bold 20px 'DejaVu Sans', sans-serif"; c.textAlign = "center";
      c.fillText("KADMİYUM", 0, 14);
      c.restore();
    } else if (prop === "cup") {
      const px = rHand[0], py = rHand[1] - 18;
      c.save();
      c.translate(px, py); c.rotate(facing * 0.12);
      c.fillStyle = "#ffffff"; c.strokeStyle = INK; c.lineWidth = 8;
      c.beginPath(); c.moveTo(-26, -30); c.lineTo(26, -30); c.lineTo(18, 28); c.lineTo(-18, 28); c.closePath();
      c.fill(); c.stroke();
      c.fillStyle = "#d93434"; c.fillRect(-20, -10, 40, 10);
      c.restore();
    } else if (prop === "geiger") {
      const gx = lHand[0], gy = lHand[1];
      c.save();
      c.translate(gx, gy);
      c.fillStyle = "#ffd23f"; c.strokeStyle = INK; c.lineWidth = 8;
      roundRect(c, -38, -28, 76, 54, 12); c.fill(); c.stroke();
      c.fillStyle = "#ffffff"; c.beginPath(); c.arc(0, -2, 18, Math.PI, Math.PI * 2); c.fill();
      c.strokeStyle = "#d92626"; c.lineWidth = 5;
      const needle = -Math.PI * 0.5 + Math.sin(t * 18) * 0.7;
      c.beginPath(); c.moveTo(0, 4); c.lineTo(Math.cos(needle) * 15, 4 + Math.sin(needle) * 15); c.stroke();
      c.restore();
    }
    c.restore();
  }

  function drawStar(c, x, y, r, rot) {
    c.save();
    c.translate(x, y); c.rotate(rot);
    c.fillStyle = "#ffe047"; c.strokeStyle = "#181722"; c.lineWidth = 6;
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const rad = i % 2 === 0 ? r : r * 0.42;
      const a = (i * Math.PI) / 4;
      if (i === 0) c.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
      else c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  function drawBadge(c, text, cx, cy, bg, fg, scale = 1.0, tilt = 0) {
    if (scale <= 0.02) return;
    c.save();
    c.translate(cx, cy); c.rotate(tilt); c.scale(scale, scale);
    c.font = "bold 44px 'DejaVu Sans', sans-serif";
    const tw = c.measureText(text).width;
    const pw = tw + 68, ph = 84;
    c.fillStyle = "rgba(0,0,0,0.38)"; roundRect(c, -pw / 2 + 6, -ph / 2 + 10, pw, ph, 42); c.fill();
    c.fillStyle = "#181722"; roundRect(c, -pw / 2 - 7, -ph / 2 - 7, pw + 14, ph + 14, 48); c.fill();
    c.fillStyle = bg; roundRect(c, -pw / 2, -ph / 2, pw, ph, 42); c.fill();
    c.fillStyle = fg; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(text, 0, 2);
    c.restore();
  }

  function drawCircleIcon(c, sym, cx, cy, r, bg, fg, scale = 1.0) {
    if (scale <= 0.02) return;
    c.save();
    c.translate(cx, cy); c.scale(scale, scale);
    c.fillStyle = "rgba(0,0,0,0.32)"; c.beginPath(); c.arc(6, 10, r + 6, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#181722"; c.beginPath(); c.arc(0, 0, r + 8, 0, Math.PI * 2); c.fill();
    c.fillStyle = bg; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
    c.fillStyle = fg; c.font = `bold ${Math.round(r * 1.2)}px 'DejaVu Sans', sans-serif`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(sym, 0, 4);
    c.restore();
  }

  function drawCaption(c, text, age) {
    if (!text) return;
    c.save();
    const pop = age < 0.11 ? lerp(0.86, 1.04, easeOutBack(age / 0.11)) : 1.0;
    c.translate(W / 2, 1525);
    c.scale(pop, pop);
    let fsize = 74;
    c.font = `900 ${fsize}px 'DejaVu Sans', sans-serif`;
    while (c.measureText(text).width > 940 && fsize > 46) {
      fsize -= 4;
      c.font = `900 ${fsize}px 'DejaVu Sans', sans-serif`;
    }
    c.textAlign = "center"; c.textBaseline = "middle"; c.lineJoin = "round";
    c.fillStyle = "rgba(0, 0, 0, 0.55)"; c.fillText(text, 5, 9);
    c.strokeStyle = "#111018"; c.lineWidth = 20; c.strokeText(text, 0, 0);
    c.fillStyle = "#ffffff"; c.fillText(text, 0, 0);
    c.restore();
  }

  function drawBackdropCamera(plate, zoom, panX, panY) {
    const sw = BG_W / zoom;
    const sh = BG_H / zoom;
    const sx = clamp((BG_W - sw) * 0.5 + panX, 0, BG_W - sw);
    const sy = clamp((BG_H - sh) * 0.5 + panY, 0, BG_H - sh);
    ctx.drawImage(plate, sx, sy, sw, sh, 0, 0, W, H);
  }

  // Exact sentence boundaries matching ERKAN eleven_v4 @ 1.10x (~58s)
  const CUTS = [0.0, 0.209, 0.364, 0.465, 0.598, 0.718, 0.947, 1.01];
  function getSceneInfo(frac) {
    for (let i = 0; i < CUTS.length - 1; i++) {
      if (frac >= CUTS[i] && frac < CUTS[i + 1]) {
        return { idx: i, startFrac: CUTS[i], localFrac: (frac - CUTS[i]) / (CUTS[i + 1] - CUTS[i]) };
      }
    }
    return { idx: 6, startFrac: 0.947, localFrac: 1.0 };
  }

  window.AKILALMAZ_READY = true;

  window.renderFrameAt = function(t, totalDur, captionText, captionAge, speaking) {
    const frac = clamp(t / Math.max(0.01, totalDur), 0, 0.9999);
    const { idx, startFrac, localFrac } = getSceneInfo(frac);
    const tLocal = (frac - startFrac) * totalDur;

    if (idx === 0) {
      // HOOK: Stagg Field Reactor + Hanging SCRAM Rod + Fermi + Axeman
      const zoom = lerp(1.02, 1.12, easeInOut(localFrac));
      const panX = Math.sin(localFrac * Math.PI) * 32;
      drawBackdropCamera(PLATES.reactor, zoom, panX, 0);

      // Living emerald reactor glow pulse
      const pulse = 0.08 + 0.06 * Math.sin(t * 4.5);
      const rg = ctx.createRadialGradient(540, 1080, 30, 540, 1080, 460);
      rg.addColorStop(0, `rgba(95, 255, 130, ${pulse.toFixed(3)})`);
      rg.addColorStop(1, "rgba(95, 255, 130, 0)");
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

      drawStickChar(ctx, "fermi", 285 - panX * 0.25, 1790, 1.12, t, { emotion: "happy", pose: "point_up", speaking, facing: 1, phase: 0.2, prop: "geiger" });
      drawStickChar(ctx, "axeman", 800 - panX * 0.25, 1790, 1.12, t, { emotion: "shock", pose: "axe_ready", speaking: false, facing: -1, phase: 1.5, prop: "axe" });

      if (tLocal > 0.35) drawCircleIcon(ctx, "?", 910, 310 + Math.sin(t * 5) * 10, 58, "#ffd644", "#181722", easeOutBack((tLocal - 0.35) / 0.32));
      if (tLocal > 1.8) drawBadge(ctx, "ACİL FREN = BALTA!", 540, 200, "#d92626", "#ffffff", easeOutBack((tLocal - 1.8) / 0.35), -0.02);

    } else if (idx === 1) {
      // SETUP: Dec 2, 1942 Chicago Pile-1 + Enrico Fermi + Shocked Assistant
      const zoom = lerp(1.05, 1.14, easeInOut(localFrac));
      const panX = lerp(-48, 48, easeInOut(localFrac));
      drawBackdropCamera(PLATES.reactor, zoom, panX, 18);

      const pulse = 0.10 + 0.08 * Math.sin(t * 6.0);
      const rg = ctx.createRadialGradient(540, 1080, 30, 540, 1080, 480);
      rg.addColorStop(0, `rgba(110, 255, 130, ${pulse.toFixed(3)})`);
      rg.addColorStop(1, "rgba(110, 255, 130, 0)");
      ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);

      drawStickChar(ctx, "fermi", 300 - panX * 0.35, 1795, 1.14, t, { emotion: "smug", pose: "idle", speaking, facing: 1, phase: 0.4, prop: "geiger" });
      drawStickChar(ctx, "scientist2", 790 - panX * 0.35, 1795, 1.10, t, { emotion: "shock", pose: "panic", speaking: false, facing: -1, phase: 2.1, prop: "none" });

      drawBadge(ctx, "2 ARALIK 1942 · CHICAGO", 540, 205, "#1d56a8", "#ffe066", easeOutBack(tLocal / 0.35), 0.015);
      if (tLocal > 2.2) drawCircleIcon(ctx, "!", 900, 345 + Math.sin(t * 6) * 8, 56, "#ff6338", "#ffffff", easeOutBack((tLocal - 2.2) / 0.32));

    } else if (idx === 2) {
      // BOARD NAVY: No Cooling! No Shield! 400 Tons Graphite!
      const zoom = lerp(1.02, 1.10, easeInOut(localFrac));
      const panX = Math.sin(localFrac * Math.PI) * 26;
      drawBackdropCamera(PLATES.board2, zoom, panX, 0);

      drawStickChar(ctx, "fermi", 290, 1805, 1.08, t, { emotion: "happy", pose: "wave", speaking, facing: 1, phase: 0.1, prop: "none" });
      drawStickChar(ctx, "scientist2", 790, 1805, 1.08, t, { emotion: "panic", pose: "panic", speaking: false, facing: -1, phase: 1.9, prop: "none" });

      if (tLocal > 0.45) drawBadge(ctx, "400 TON GRAFİT!", 540, 195, "#ffd644", "#181722", easeOutBack((tLocal - 0.45) / 0.35), -0.02);

    } else if (idx === 3) {
      // BOARD CRIMSON: THE AXE MAN! (SCRAM!)
      const zoom = lerp(1.03, 1.13, easeInOut(localFrac));
      const shakeX = Math.sin(t * 28) * 6 * clamp(localFrac * 2, 0, 1);
      const shakeY = Math.cos(t * 24) * 4 * clamp(localFrac * 2, 0, 1);
      drawBackdropCamera(PLATES.board3, zoom, shakeX, shakeY);

      drawStickChar(ctx, "fermi", 270, 1805, 1.05, t, { emotion: "nervous", pose: "point_up", speaking, facing: 1, phase: 0.6, prop: "none" });
      drawStickChar(ctx, "axeman", 795, 1805, 1.13, t, { emotion: "shock", pose: "axe_swing", speaking: false, facing: -1, phase: 0.2, prop: "axe" });

      if (tLocal > 0.4) drawBadge(ctx, "SCRAM · İPİ KES!", 540, 195, "#ffcf33", "#181722", easeOutBack((tLocal - 0.4) / 0.32), 0.02);

    } else if (idx === 4) {
      // BOARD ORANGE: PLAN B — "İNTİHAR TİMİ" WITH BLUE CADMIUM BUCKETS!
      const zoom = lerp(1.02, 1.10, easeInOut(localFrac));
      const panX = Math.sin(t * 2.2) * 24;
      drawBackdropCamera(PLATES.board4, zoom, panX, 0);

      drawStickChar(ctx, "scientist2", 215, 1815, 0.96, t, { emotion: "panic", pose: "bucket", speaking: false, facing: 1, phase: 0.3, prop: "bucket" });
      drawStickChar(ctx, "scientist3", 540, 1825, 1.02, t, { emotion: "shock", pose: "bucket", speaking, facing: 1, phase: 1.4, prop: "bucket" });
      drawStickChar(ctx, "fermi", 865, 1815, 0.96, t, { emotion: "nervous", pose: "bucket", speaking: false, facing: -1, phase: 2.5, prop: "bucket" });

      if (tLocal > 0.4) drawBadge(ctx, "KADMİYUM KOVALARI!", 540, 195, "#1f88e5", "#ffffff", easeOutBack((tLocal - 0.4) / 0.35), -0.02);

    } else if (idx === 5) {
      // BOARD EMERALD: 15:25 NUCLEAR AGE BEGINS! PAPER CUP CELEBRATION!
      const zoom = lerp(1.02, 1.11, easeInOut(localFrac));
      drawBackdropCamera(PLATES.board5, zoom, 0, 0);

      // Sparkly floating golden victory stars!
      [[145, 310, 32, 0.2], [935, 340, 36, 1.4], [130, 1140, 28, 2.5], [945, 1110, 30, 3.6]].forEach(([sx, sy, sr, ph]) => {
        drawStar(ctx, sx, sy + Math.sin(t * 3.5 + ph) * 18, sr * (0.9 + 0.15 * Math.sin(t * 5 + ph)), t * 1.4 + ph);
      });

      drawStickChar(ctx, "fermi", 300, 1805, 1.12, t, { emotion: "happy", pose: "toast", speaking, facing: 1, phase: 0.3, prop: "cup" });
      drawStickChar(ctx, "axeman", 780, 1805, 1.12, t, { emotion: "happy", pose: "toast", speaking: false, facing: -1, phase: 1.1, prop: "cup" });

      if (tLocal > 0.4) drawBadge(ctx, "28 DAKİKA · BAŞARILI!", 540, 195, "#ffd644", "#181722", easeOutBack((tLocal - 0.4) / 0.35), 0.015);

    } else {
      // SCENE 6: SEAMLESS LOOP RETURN TO STAGG FIELD REACTOR!
      const zoom = lerp(1.08, 1.02, easeInOut(localFrac));
      drawBackdropCamera(PLATES.reactor, zoom, 0, 0);

      drawStickChar(ctx, "fermi", 285, 1790, 1.12, t, { emotion: "happy", pose: "cheer", speaking, facing: 1, phase: 0.2, prop: "geiger" });
      drawStickChar(ctx, "axeman", 800, 1790, 1.12, t, { emotion: "happy", pose: "axe_ready", speaking: false, facing: -1, phase: 1.5, prop: "axe" });
    }

    // Crisp white flash transition at scene cuts (exact v16-v20 style!)
    if (idx > 0 && tLocal < 0.16) {
      const alpha = (1.0 - tLocal / 0.16) * 0.72;
      ctx.fillStyle = `rgba(255, 250, 238, ${alpha.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
    }

    // Bold synced Turkish subtitle
    drawCaption(ctx, captionText, captionAge);
  };

  window.renderFrameJpeg = function(t, totalDur, captionText, captionAge, speaking) {
    window.renderFrameAt(t, totalDur, captionText, captionAge, speaking);
    return hudCanvas.toDataURL("image/jpeg", 0.86).slice(23);
  };
})();
</script>
</body>
</html>
