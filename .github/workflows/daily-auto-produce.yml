name: Tam Otonom Günlük Video Üretimi (02:00 TR)

on:
  schedule:
    # Her gece 02:00 TR (23:00 UTC) -> Sabah 06:01-06:07 TR slotundan 4 saat önce hazır!
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      topic_hint:
        description: 'Özel konu ipucu (opsiyonel, boş bırakılırsa AI özgün konu seçer)'
        required: false
        default: ''
      auto_schedule:
        description: 'Üretilen videoyu sıradaki 06:01-06:07 TR slotuna otomatik planla'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout studio repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg, DejaVu fonts & Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet requests pillow

      - name: Produce Daily Short (Gemini + ERKAN Voice + Vertex Cover + FFmpeg)
        env:
          LIKYA_API_KEY: ${{ secrets.LIKYA_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TOPIC_HINT: ${{ inputs.topic_hint || '' }}
          AUTO_SCHEDULE: ${{ inputs.auto_schedule != false && 'true' || 'false' }}
        run: python3 scripts/auto_produce_daily.py

      - name: Commit & Publish to studio.likyastudios.live
        run: |
          git config user.name "AKILALMAZ Auto Producer"
          git config user.email "bot@likyastudios.live"
          git add files/ videos.json
          git commit -m "Otonom günlük video üretimi ($(date -u +'%Y-%m-%d'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Schedule after the video is really live
        if: ${{ inputs.auto_schedule != false }}
        env:
          LIKYA_API_KEY: ${{ secrets.LIKYA_API_KEY }}
        run: python3 scripts/auto_produce_daily.py --schedule-pending
